<nav class="navbar navbar-expand-lg navbar-dark shadow-lg sticky-top t-nav" aria-label="Navegación principal">
  <div class="container">
    <a class="navbar-brand t-marca d-flex align-items-center" routerLink="/servicios" (click)="cerrarMenu()">
      <i class="bi bi-scissors me-2" aria-hidden="true"></i>BARBERÍA TAURUS
    </a>

    <!-- Botón del menú en móvil -->
    <button class="navbar-toggler" type="button" (click)="toggleMenu()"
            aria-controls="navbarNav" aria-label="Abrir menú de navegación" [attr.aria-expanded]="menuAbierto">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" [class.show]="menuAbierto" id="navbarNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
        <li class="nav-item">
          <a class="nav-link t-nav-link px-3" routerLink="/servicios" routerLinkActive="active" (click)="cerrarMenu()">Servicios</a>
        </li>
        <li class="nav-item">
          <a class="nav-link t-nav-link px-3" routerLink="/reservar" routerLinkActive="active" (click)="cerrarMenu()">Reservar Cita</a>
        </li>
        @if (auth.usuario()) {
          <li class="nav-item">
            <a class="nav-link t-nav-link px-3" routerLink="/mis-reservas" routerLinkActive="active" (click)="cerrarMenu()">Mis Reservas</a>
          </li>
        }
        @if (auth.esAdmin()) {
          <li class="nav-item">
            <a class="nav-link t-nav-link px-3" routerLink="/admin" routerLinkActive="active" (click)="cerrarMenu()">Panel Admin</a>
          </li>
        }
      </ul>

      <div class="d-flex flex-wrap gap-2 align-items-center">
        @if (auth.usuario(); as u) {
          <span class="t-subtitulo me-2">{{ u.nombre }}</span>
          <button type="button" (click)="cerrarSesion()" class="btn btn-sm btn-outline-champagne px-3 py-2">Cerrar sesión</button>
        } @else {
          <a routerLink="/login" (click)="cerrarMenu()" class="btn btn-sm btn-outline-champagne px-3 py-2">Iniciar sesión</a>
          <a routerLink="/registro" (click)="cerrarMenu()" class="btn btn-sm btn-champagne px-3 py-2">Registrarse</a>
        }
      </div>
    </div>
  </div>
</nav>
