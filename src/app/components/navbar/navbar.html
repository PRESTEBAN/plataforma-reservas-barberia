<nav class="navbar navbar-expand-lg navbar-dark shadow-lg sticky-top" style="background-color: #0b0b0b; border-bottom: 2px solid #C6A66B; box-shadow: 0 4px 20px rgba(198, 166, 107, 0.25);">
  <div class="container">
    <a class="navbar-brand fw-black fs-2 text-uppercase d-flex align-items-center" routerLink="/servicios" (click)="cerrarMenu()"
       style="color: #C6A66B; font-weight: 900; letter-spacing: 2px; text-shadow: 0 0 15px rgba(198,166,107,0.8);">
      <i class="bi bi-scissors me-2" style="font-size: 1.8rem; color: #C6A66B;"></i>BARBERÍA TAURUS
    </a>

    <button class="navbar-toggler" type="button" (click)="toggleMenu()"
            aria-label="Abrir menú de navegación" [attr.aria-expanded]="menuAbierto">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" [class.show]="menuAbierto" id="navbarNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0 text-uppercase fw-bold ms-lg-4" style="font-size: 0.95rem; letter-spacing: 1px;">
        <li class="nav-item">
          <a class="nav-link px-3" routerLink="/servicios" routerLinkActive="active" (click)="cerrarMenu()"
             style="color: #F0E9DC;">Servicios</a>
        </li>
        <li class="nav-item">
          <a class="nav-link px-3" routerLink="/reservar" routerLinkActive="active" (click)="cerrarMenu()"
             style="color: #F0E9DC;">Reservar Cita</a>
        </li>
        @if (auth.usuario()) {
          <li class="nav-item">
            <a class="nav-link px-3" routerLink="/mis-reservas" routerLinkActive="active" (click)="cerrarMenu()"
               style="color: #F0E9DC;">Mis Reservas</a>
          </li>
        }
        @if (auth.esAdmin()) {
          <li class="nav-item">
            <a class="nav-link px-3 fw-bold" routerLink="/admin" routerLinkActive="active" (click)="cerrarMenu()"
               style="color: #C6A66B; text-shadow: 0 0 8px rgba(198,166,107,0.4);">Panel Admin</a>
          </li>
        }
      </ul>

      <div class="d-flex gap-2 align-items-center">
        @if (auth.usuario(); as u) {
          <span class="small fw-bold text-uppercase" style="color: #F0E9DC;">{{ u.nombre }}</span>
          <button type="button" (click)="cerrarSesion()" class="btn btn-sm fw-black text-uppercase px-3 py-2"
                  style="border: 2px solid #C6A66B; color: #C6A66B; background: transparent; font-weight: 800; letter-spacing: 0.5px;">
            Cerrar Sesión
          </button>
        } @else {
          <a routerLink="/login" (click)="cerrarMenu()" class="btn btn-sm fw-black text-uppercase px-3 py-2"
             style="border: 2px solid #C6A66B; color: #C6A66B; background: transparent; font-weight: 800; letter-spacing: 0.5px;">
            Iniciar Sesión
          </a>
          <a routerLink="/registro" (click)="cerrarMenu()" class="btn btn-sm fw-black text-uppercase px-3 py-2"
             style="background-color: #C6A66B; color: #111111; border: none; font-weight: 900; letter-spacing: 0.5px; box-shadow: 0 0 12px rgba(198, 166, 107, 0.5);">
            Registrarse
          </a>
        }
      </div>
    </div>
  </div>
</nav>
