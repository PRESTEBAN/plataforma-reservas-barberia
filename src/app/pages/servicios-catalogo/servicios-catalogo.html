<div class="container py-4">
  <div class="text-center mb-5">
    <h2 class="fw-bold display-6">Nuestros Servicios</h2>
    <p class="text-muted">Elige el servicio de tu preferencia y agenda tu cita en pocos pasos.</p>
  </div>

  <div class="row g-4">
    <div class="col-md-4" *ngFor="let servicio of servicios">
      <div class="card h-100 shadow-sm border-0">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title fw-bold text-dark">{{ servicio.nombre }}</h5>
          <p class="card-text text-muted flex-grow-1">{{ servicio.descripcion }}</p>
          
          <div class="d-flex justify-content-between align-items-center my-3">
            <span class="badge bg-secondary">
              {{ servicio.duracionMinutos }} min
            </span>
            <span class="fs-4 fw-bold text-success">${{ servicio.precio.toFixed(2) }}</span>
          </div>

          <a [routerLink]="['/reservar']" [queryParams]="{ servicioId: servicio.id }" class="btn btn-dark w-100 fw-bold">
            Reservar Este Servicio
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
