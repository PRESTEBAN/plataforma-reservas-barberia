<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="t-card p-3">
        <div class="card-body p-4 text-center">

          <i class="bi bi-person-plus-fill display-3 mb-2 d-block t-dorado" aria-hidden="true"></i>
          <span class="t-badge mb-2">Barbería TAURUS</span>
          <h1 class="h3 t-titulo mb-3">Crear cuenta</h1>

          <div *ngIf="mensajeError" class="t-alerta t-alerta-error text-start" role="alert">
            <i class="bi bi-exclamation-triangle-fill fs-5" aria-hidden="true"></i>
            <div>{{ mensajeError }}</div>
          </div>

          <form [formGroup]="registroForm" (ngSubmit)="onSubmit()" novalidate>
            <div class="mb-3 text-start">
              <label for="registro-nombre" class="form-label t-label">Nombre completo</label>
              <input id="registro-nombre" type="text" class="form-control form-control-lg t-input"
                     placeholder="Tu nombre, mi pana" autocomplete="name" formControlName="nombre"
                     [ngClass]="{'is-invalid': registroForm.get('nombre')?.touched && registroForm.get('nombre')?.invalid}">
              <div class="invalid-feedback">Ingresa tu nombre completo (mínimo 3 caracteres).</div>
            </div>

            <div class="mb-3 text-start">
              <label for="registro-email" class="form-label t-label">Correo electrónico</label>
              <input id="registro-email" type="email" class="form-control form-control-lg t-input"
                     placeholder="correo@ejemplo.com" autocomplete="email" formControlName="email"
                     [ngClass]="{'is-invalid': registroForm.get('email')?.touched && registroForm.get('email')?.invalid}">
              <div class="invalid-feedback">Ingresa un correo electrónico válido.</div>
            </div>

            <div class="mb-4 text-start">
              <label for="registro-password" class="form-label t-label">Contraseña</label>
              <input id="registro-password" type="password" class="form-control form-control-lg t-input"
                     placeholder="Mínimo 6 caracteres" autocomplete="new-password" formControlName="password"
                     [ngClass]="{'is-invalid': registroForm.get('password')?.touched && registroForm.get('password')?.invalid}">
              <div class="invalid-feedback">La contraseña debe tener al menos 6 caracteres.</div>
            </div>

            <button type="submit" class="btn btn-lg btn-champagne text-uppercase w-100 py-3 mb-3" [disabled]="cargando">
              {{ cargando ? 'REGISTRANDO...' : 'REGISTRARSE' }}
            </button>

            <a routerLink="/login" class="text-uppercase fw-bold small text-decoration-none d-block t-marfil">
              ¿Ya tienes cuenta? <span class="t-dorado">Inicia sesión</span>
            </a>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>
