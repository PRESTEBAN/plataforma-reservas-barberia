<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card p-3 shadow-lg" 
           style="background-color: #1a1a1a; border: 2px solid #C6A66B; border-radius: 12px; box-shadow: 0 0 25px rgba(198, 166, 107, 0.25);">
        <div class="card-body p-4 text-center">
          
          <i class="bi bi-person-plus-fill display-3 mb-2 d-block" style="color: #C6A66B;"></i>
          <span class="badge px-3 py-2 text-uppercase mb-2" style="background-color: #242424; color: #C6A66B; border: 1px solid #C6A66B; font-weight: 800; letter-spacing: 1.5px;">
            BARBERÍA TAURUS
          </span>
          <h3 class="fw-black text-uppercase mb-3" style="color: #C6A66B; font-weight: 900; letter-spacing: 2px;">
            CREAR CUENTA
          </h3>

          <div *ngIf="mensajeError" class="alert d-flex align-items-center mb-3 text-start" role="alert" 
               style="background-color: #242424; color: #ff6b6b; border: 1px solid #ff6b6b; font-weight: 700; font-size: 0.85rem;">
            <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
            <div>{{ mensajeError }}</div>
          </div>

          <form [formGroup]="registroForm" (ngSubmit)="onSubmit()">
            <div class="mb-3 text-start">
              <label class="form-label text-uppercase fw-bold" style="color: #C6A66B; font-size: 0.85rem;">Nombre Completo</label>
              <input 
                type="text" 
                class="form-control form-control-lg" 
                style="background-color: #0b0b0b; border: 1px solid #C6A66B; color: #F0E9DC;" 
                placeholder="Tu nombre, mi pana"
                formControlName="nombre"
                [ngClass]="{'is-invalid': registroForm.get('nombre')?.touched && registroForm.get('nombre')?.invalid}">
              <div class="invalid-feedback text-danger fw-bold">Ingresa tu nombre completo (mínimo 3 caracteres).</div>
            </div>

            <div class="mb-3 text-start">
              <label class="form-label text-uppercase fw-bold" style="color: #C6A66B; font-size: 0.85rem;">Correo Electrónico</label>
              <input 
                type="email" 
                class="form-control form-control-lg" 
                style="background-color: #0b0b0b; border: 1px solid #C6A66B; color: #F0E9DC;" 
                placeholder="correo@ejemplo.com"
                formControlName="email"
                [ngClass]="{'is-invalid': registroForm.get('email')?.touched && registroForm.get('email')?.invalid}">
              <div class="invalid-feedback text-danger fw-bold">Ingresa un correo electrónico válido.</div>
            </div>

            <div class="mb-4 text-start">
              <label class="form-label text-uppercase fw-bold" style="color: #C6A66B; font-size: 0.85rem;">Contraseña</label>
              <input 
                type="password" 
                class="form-control form-control-lg" 
                style="background-color: #0b0b0b; border: 1px solid #C6A66B; color: #F0E9DC;" 
                placeholder="••••••••"
                formControlName="password"
                [ngClass]="{'is-invalid': registroForm.get('password')?.touched && registroForm.get('password')?.invalid}">
              <div class="invalid-feedback text-danger fw-bold">La contraseña debe tener al menos 6 caracteres.</div>
            </div>

            <button type="submit" class="btn btn-lg w-100 fw-black text-uppercase py-3 mb-3"
                    [disabled]="cargando"
                   style="background: linear-gradient(135deg, #d4af37 0%, #C6A66B 100%); color: #111111; border: none; font-weight: 900; letter-spacing: 1px;">
            {{ cargando ? 'REGISTRANDO...' : 'REGISTRARSE' }}
          </button>

            <a routerLink="/login" [queryParams]="returnUrl ? { returnUrl: returnUrl } : null" class="text-uppercase fw-bold small text-decoration-none d-block" style="color: #F0E9DC;">
              ¿Ya tienes cuenta? <span style="color: #C6A66B;">Inicia sesión</span>
            </a>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>
